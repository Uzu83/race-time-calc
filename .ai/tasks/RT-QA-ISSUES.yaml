  - tests/feedback-entry.test.tsx
  - .ai/evidence/RT-QA-ISSUES-quality-gate.md
  - .ai/evidence/RT-QA-ISSUES.md

required_evidence:
  - unit test (feedback-entry open/close)
  - quality-gate or pnpm test+typecheck+check
  - browser verification for #8 (390 / 640 / 768+)

